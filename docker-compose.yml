services:
  db:
    image: postgres:16
    container_name: pg_transacoes
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transacoes}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dados:/dados:ro   # CSVs
      - ./sql:/sql:ro       # scripts SQL

volumes:
  pgdata:
